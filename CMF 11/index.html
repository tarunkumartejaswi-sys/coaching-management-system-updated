<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Professional coaching institute management portal for students, academics, attendance, homework, notices and fees." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *{box-sizing:border-box} html,body,#root{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} body{background:#f8fafc;color:#0f172a} button,input,select,textarea{font:inherit} button{transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease} button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 7px 18px rgba(15,23,42,.10)} button:disabled{opacity:.6;cursor:not-allowed} @media(max-width:800px){.desktop-hide{display:none}.profileEditGrid{grid-template-columns:1fr!important}.snapshotGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.dashboardHero{flex-direction:column;align-items:flex-start!important}.topbar{flex-wrap:wrap}.sidebar{width:180px!important}.main{padding:16px!important}} @media(max-width:620px){.layout{display:block!important}.sidebar{width:100%!important;display:flex;overflow-x:auto;gap:6px;padding:8px!important}.sidebar button{min-width:max-content!important;width:auto!important;margin:0!important}.topbar{padding:10px 14px!important}.topbarUser{display:none!important}.main{padding:12px!important}.dashboardGrid{grid-template-columns:1fr!important}.grid{grid-template-columns:1fr!important}.snapshotGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.quickGrid{grid-template-columns:1fr 1fr!important}.modalCard{padding:18px!important}.table{min-width:680px!important}}
    </style>
    <title>Coaching Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
